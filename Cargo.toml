[package]
name = "calm"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
gpui = "0.2.2"
icalendar = { version = "0.17", features = ["chrono-tz"] }
kdl = { version = "6", features = ["v1-fallback"] }
libc = "0.2"
rrule = "0.14"
base64 = "0.22"
getrandom = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
unicode-segmentation = "1.13"
ureq = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"

[patch.crates-io]
# xattr 0.2.3 (pulled in by gpui 0.2.2's http client) references libc::ENOATTR,
# which newer libc dropped on Linux. ENODATA is the same errno there.
xattr = { path = "patches/xattr" }
# gpui 0.2.2 + `Window::paint_glyph_rotated` for text set along arcs.
gpui = { path = "patches/gpui" }
